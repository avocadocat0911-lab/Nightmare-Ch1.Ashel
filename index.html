<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nightmare</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            background: black;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* 게임 화면 */
        .game-screen {
            height: 100vh;
            aspect-ratio: 3 / 4;

            position: relative;
            overflow: hidden;

            background-image: url("background.jpeg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* 처음에 배경을 흐리게 만드는 막 */
        .blur-overlay {
            position: absolute;
            inset: -15px;

            background-image: url("background.jpeg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            filter: blur(10px);
            transform: scale(1.03);

            z-index: 2;

            transition: opacity 1s ease;
        }

        /* PLAY 버튼 */
        #playButton {
            position: absolute;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            padding: 14px 40px;

            background: rgba(0, 0, 0, 0.85);
            color: white;

            border: 1px solid rgba(255, 255, 255, 0.8);

            font-size: 18px;
            letter-spacing: 3px;

            cursor: pointer;

            z-index: 10;
        }

        #playButton:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        /* 게임 시작 후 */
        .game-screen.started .blur-overlay {
            opacity: 0;
            pointer-events: none;
        }

        .game-screen.started #playButton {
            opacity: 0;
            pointer-events: none;
        }

        /* 모바일 */
        @media (max-width: 600px) {
            .game-screen {
                width: 100vw;
                height: 100dvh;
                aspect-ratio: auto;
            }
        }
    </style>
</head>

<body>

    <div class="game-screen" id="gameScreen">

        <!-- 흐린 배경 -->
        <div class="blur-overlay"></div>

        <!-- PLAY 버튼 -->
        <button id="playButton">PLAY</button>

    </div>


    <!-- BGM -->
    <audio id="bgm" src="bgm_clean.mp3" autoplay loop></audio>


    <script>
        const gameScreen = document.getElementById("gameScreen");
        const playButton = document.getElementById("playButton");
        const bgm = document.getElementById("bgm");

        // BGM 볼륨
        bgm.volume = 0.3;

        // 사이트에 들어오자마자 자동재생 시도
        bgm.play().catch(() => {
            // 브라우저가 자동재생을 막은 경우
            console.log("자동재생이 차단되었습니다.");
        });


        // PLAY 버튼
        playButton.addEventListener("click", function () {

            // 블러 제거
            gameScreen.classList.add("started");

            // 자동재생이 막혀 있었다면 여기서 재생
            if (bgm.paused) {
                bgm.play().catch(() => {
                    console.log("BGM 재생 실패");
                });
            }

        });
    </script>

</body>
</html>
