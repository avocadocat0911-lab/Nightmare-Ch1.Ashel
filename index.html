<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nightmare</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            background: #000;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }


        /* =========================
           게임 화면
        ========================= */

        #game {
            position: relative;

            width: auto;
            height: 100vh;

            aspect-ratio: 3 / 4;

            overflow: hidden;

            background-image: url("./background.jpeg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }


        /* =========================
           시작 전 배경 블러
        ========================= */

        #blur {
            position: absolute;

            top: -30px;
            left: -30px;
            right: -30px;
            bottom: -30px;

            background-image: url("./background.jpeg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            filter: blur(18px);
            transform: scale(1.08);

            z-index: 2;

            opacity: 1;

            pointer-events: none;

            transition: opacity 0.8s ease;
        }


        /* =========================
           비네트
        ========================= */

        #vignette {
            position: absolute;
            inset: 0;

            z-index: 5;

            pointer-events: none;

            background: radial-gradient(
                ellipse at center,
                rgba(0, 0, 0, 0) 25%,
                rgba(0, 0, 0, 0.15) 45%,
                rgba(0, 0, 0, 0.45) 65%,
                rgba(0, 0, 0, 0.75) 82%,
                rgba(0, 0, 0, 0.95) 100%
            );
        }


        /* ==================================================
           캐릭터
        ================================================== */

        #character {
            position: absolute;

            left: 50%;
            bottom: -18px;

            width: 840px;
            height: 840px;

            transform: translateX(-50%);

            z-index: 9;

            object-fit: contain;
            object-position: center bottom;

            display: block;

            filter: blur(12px);

            /*
             * 캐릭터 클릭 가능
             */
            pointer-events: auto;

            cursor: default;

            animation: characterFloat 4.5s ease-in-out infinite;
            animation-play-state: paused;

            transform-origin: center bottom;

            transition: filter 0.8s ease;
        }


        /* ==================================================
           화난 캐릭터
        ================================================== */

        #angryCharacter {
            position: absolute;

            left: 50%;
            bottom: -18px;

            width: 840px;
            height: 840px;

            transform: translateX(-50%);

            z-index: 9;

            object-fit: contain;
            object-position: center bottom;

            display: none;

            filter: blur(12px);

            pointer-events: auto;

            cursor: default;

            animation: characterFloat 4.5s ease-in-out infinite;
            animation-play-state: paused;

            transform-origin: center bottom;

            transition: filter 0.8s ease;
        }


        /* =========================
           캐릭터 위아래 움직임
        ========================= */

        @keyframes characterFloat {

            0% {
                transform: translateX(-50%) translateY(0);
            }

            50% {
                transform: translateX(-50%) translateY(-10px);
            }

            100% {
                transform: translateX(-50%) translateY(0);
            }

        }


        /* ==================================================
           PLAY 이후
        ================================================== */

        #game.started #character,
        #game.started #angryCharacter {

            filter: blur(0);

            animation-play-state: running;

            cursor: pointer;
        }


        /* ==================================================
           캐릭터 마우스 오버
           PLAY 이후에만 외곽선
        ================================================== */

        #game.started #character:hover,
        #game.started #angryCharacter:hover {

            animation:
                characterFloat 4.5s ease-in-out infinite,
                characterGlow 2.2s ease-in-out infinite;
        }


        /* ==================================================
           흰색 외곽선 깜빡임
        ================================================== */

        @keyframes characterGlow {

            0% {
                filter:
                    blur(0)
                    drop-shadow(
                        0 0 0 rgba(255,255,255,0)
                    )
                    drop-shadow(
                        0 0 2px rgba(255,255,255,0.15)
                    );
            }

            50% {
                filter:
                    blur(0)
                    drop-shadow(
                        0 0 2px rgba(255,255,255,1)
                    )
                    drop-shadow(
                        0 0 8px rgba(255,255,255,0.8)
                    )
                    drop-shadow(
                        0 0 15px rgba(255,255,255,0.4)
                    );
            }

            100% {
                filter:
                    blur(0)
                    drop-shadow(
                        0 0 0 rgba(255,255,255,0)
                    )
                    drop-shadow(
                        0 0 2px rgba(255,255,255,0.15)
                    );
            }

        }


        /* ==================================================
           시작 전 그림자
        ================================================== */

        #shadow {

            position: absolute;

            left: 50%;
            bottom: -18px;

            width: 840px;
            height: 840px;

            transform: translateX(-50%);

            /*
             * 캐릭터 위에 덮이지만 클릭을 방해하지 않음
             */
            z-index: 10;

            pointer-events: none;

            object-fit: contain;
            object-position: center bottom;

            mix-blend-mode: multiply;

            opacity: 1;
        }


        /* ==================================================
           고정 말풍선
        ================================================== */

        #speechBalloon {

            position: absolute;

            left: 50%;

            /* 조금 더 위 */
            top: 40px;

            /* 살짝 작게 */
            width: 700px;
            height: 700px;

            transform:
                translateX(-50%)
                scale(0.9);

            z-index: 25;

            object-fit: contain;

            opacity: 0;

            pointer-events: none;

            transition:
                opacity 0.25s ease,
                transform 0.25s ease;
        }


        /* =========================
           클릭 후 말풍선 등장
        ========================= */

        #game.character-angry #speechBalloon {

            opacity: 1;

            transform:
                translateX(-50%)
                scale(1);
        }


        /* ==================================================
           PLAY 영역
        ================================================== */

        #playArea {

            position: absolute;

            top: 50%;
            left: 50%;

            transform: translate(-50%, -50%);

            z-index: 30;

            display: flex;
            flex-direction: column;
            align-items: center;

            transition: opacity 0.5s ease;
        }


        /* =========================
           PLAY 아이콘
        ========================= */

        #playIcon {

            width: 600px;
            height: 220px;

            object-fit: contain;

            display: block;

            margin-bottom: 2px;

            filter: none;

            opacity: 1;

            pointer-events: none;

            animation:
                playIconFloat 4s ease-in-out infinite;
        }


        @keyframes playIconFloat {

            0% {
                transform:
                    translateY(0)
                    scale(1.8);
            }

            50% {
                transform:
                    translateY(-12px)
                    scale(1.8);
            }

            100% {
                transform:
                    translateY(0)
                    scale(1.8);
            }

        }


        /* =========================
           PLAY 버튼
        ========================= */

        #play {

            position: relative;

            z-index: 40;

            width: 115px;
            height: 38px;

            padding: 0;

            background:
                rgba(0, 0, 0, 0.85);

            border:
                1px solid white;

            color: white;

            font-size: 13px;

            letter-spacing: 3px;

            cursor: pointer;

            pointer-events: auto;
        }


        #play:hover {

            background:
                rgba(255, 255, 255, 0.15);
        }


        /* ==================================================
           음악바
        ================================================== */

        #musicBar {

            position: absolute;

            left: 0;
            right: 0;
            bottom: 0;

            height: 42px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding:
                0 12px 0 14px;

            background:
                rgba(0, 0, 0, 0.8);

            border-top:
                1px solid rgba(255,255,255,0.35);

            z-index: 20;

            color: #ffffff;

            filter: blur(7px);

            opacity: 0.7;

            transition:
                filter 0.8s ease,
                opacity 0.8s ease;
        }


        /* =========================
           노래 제목
        ========================= */

        #songTitle {

            display: block;

            color: #ffffff;

            font-size: 12px;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;

            letter-spacing: 0.5px;

            min-width: 0;
        }


        /* =========================
           음악 버튼
        ========================= */

        #musicButton {

            width: 30px;
            height: 30px;

            flex-shrink: 0;

            margin-left: 10px;

            border: none;

            background: transparent;

            color: #ffffff;

            font-size: 18px;

            cursor: pointer;

            display: flex;

            align-items: center;

            justify-content: center;
        }


        /* ==================================================
           PLAY 이후
        ================================================== */

        #game.started #blur {
            opacity: 0;
        }


        /* 그림자는 완전히 제거 */

        #game.started #shadow {
            display: none;
        }


        /* PLAY 제거 */

        #game.started #playArea {
            opacity: 0;

            pointer-events: none;
        }


        /* 음악바 선명 */

        #game.started #musicBar {

            filter: blur(0);

            opacity: 1;
        }


        /* ==================================================
           모바일
        ================================================== */

        @media (max-width: 600px) {

            #game {

                width: 100vw;

                height: 100dvh;

                aspect-ratio: auto;
            }


            #character,
            #angryCharacter {

                width: 660px;

                height: 660px;

                bottom: -14px;
            }


            #shadow {

                width: 660px;

                height: 660px;

                bottom: -14px;
            }


            #speechBalloon {

                width: 570px;

                height: 570px;

                top: 55px;
            }


            #musicBar {

                left: 0;

                right: 0;

                bottom: 0;
            }


            #songTitle {

                font-size: 11px;
            }


            #playIcon {

                width: 600px;

                height: 210px;
            }


            #play {

                width: 105px;

                height: 36px;

                font-size: 12px;
            }

        }

    </style>

</head>


<body>

    <div id="game">


        <!-- =========================
             배경 블러
        ========================= -->

        <div id="blur"></div>


        <!-- 비네트 -->

        <div id="vignette"></div>


        <!-- =========================
             캐릭터
        ========================= -->

        <img
            id="character"
            class="activeCharacter"
            src="./blink.Ashel.webp"
            alt="">


        <!-- =========================
             화난 캐릭터
        ========================= -->

        <img
            id="angryCharacter"
            src="./angry.Ashel.png"
            alt="">


        <!-- =========================
             그림자
        ========================= -->

        <img
            id="shadow"
            src="./shadow.Ashel.png"
            alt="">


        <!-- =========================
             고정 말풍선
        ========================= -->

        <img
            id="speechBalloon"
            src="./speech.balloon.png"
            alt="">


        <!-- =========================
             PLAY
        ========================= -->

        <div id="playArea">

            <img
                id="playIcon"
                src="./icon.png"
                alt="">


            <button
                id="play"
                type="button">

                PLAY

            </button>

        </div>


        <!-- =========================
             음악바
        ========================= -->

        <div id="musicBar">

            <span id="songTitle">

                倉庫の静寂-𝐀𝐬𝐡𝐞𝐥 𝐓𝐡𝐞𝐦𝐞 𝐬𝐨𝐧𝐠

            </span>


            <button
                id="musicButton"
                type="button"
                aria-label="BGM 끄기">

                🔊

            </button>

        </div>

    </div>


    <!-- =========================
         BGM
    ========================= -->

    <audio
        id="bgm"
        src="./bgm_clean.mp3"
        autoplay
        loop
        preload="auto">
    </audio>


    <script>

        const game =
            document.getElementById("game");

        const play =
            document.getElementById("play");

        const bgm =
            document.getElementById("bgm");

        const musicButton =
            document.getElementById("musicButton");

        const character =
            document.getElementById("character");

        const angryCharacter =
            document.getElementById("angryCharacter");


        /* =========================
           BGM
        ========================= */

        bgm.volume = 0.3;


        /* 사이트 입장 시 자동재생 시도 */

        bgm.play().catch(() => {

            console.log(
                "브라우저가 자동재생을 차단했습니다."
            );

        });


        /* =========================
           PLAY
        ========================= */

        play.addEventListener(
            "click",
            async () => {

                game.classList.add("started");


                if (bgm.paused) {

                    try {

                        await bgm.play();

                    } catch (error) {

                        console.log(
                            "BGM 재생 실패:",
                            error
                        );

                    }

                }

            }
        );


        /* ==================================================
           캐릭터 클릭
        ================================================== */

        character.addEventListener(
            "click",
            () => {

                /* PLAY 전에는 클릭 무시 */

                if (
                    !game.classList.contains("started")
                ) {

                    return;

                }


                /* 이미 화난 상태면 무시 */

                if (
                    game.classList.contains(
                        "character-angry"
                    )
                ) {

                    return;

                }


                /* 원래 캐릭터 숨김 */

                character.style.display =
                    "none";


                /* 화난 캐릭터 표시 */

                angryCharacter.style.display =
                    "block";


                /* 화난 상태 */

                game.classList.add(
                    "character-angry"
                );

            }
        );


        /* =========================
           음악 ON / OFF
        ========================= */

        musicButton.addEventListener(
            "click",
            async () => {

                if (bgm.paused) {

                    try {

                        await bgm.play();

                    } catch (error) {

                        console.log(
                            "BGM 재생 실패:",
                            error
                        );

                    }

                } else {

                    bgm.pause();

                }

            }
        );


        /* =========================
           음악 아이콘
        ========================= */

        bgm.addEventListener(
            "play",
            () => {

                musicButton.textContent =
                    "🔊";

            }
        );


        bgm.addEventListener(
            "pause",
            () => {

                musicButton.textContent =
                    "🔇";

            }
        );

    </script>

</body>
</html>
