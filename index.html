<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nightmare</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            background: black;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* 게임 화면 */
        .game-screen {
            height: 100vh;
            aspect-ratio: 3 / 4;

            background-image: url("background.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            cursor: pointer;
        }

        /* 모바일 */
        @media (max-width: 600px) {
            .game-screen {
                width: 100vw;
                height: 100dvh;
                aspect-ratio: auto;

                background-size: cover;
            }
        }
    </style>
</head>

<body>

    <div class="game-screen" id="game"></div>

    <!-- BGM -->
    <audio id="bgm" src="bgm_clean.mp3" autoplay muted loop></audio>

    <script>
        const bgm = document.getElementById("bgm");
        const game = document.getElementById("game");

        // BGM 볼륨
        bgm.volume = 0.3;

        // 페이지에 들어오면 일단 자동재생 시도
        bgm.play().catch(() => {});

        // 화면을 클릭하면 음소거 해제 + 음악 재생
        game.addEventListener("click", () => {
            bgm.muted = false;
            bgm.volume = 0.3;
            bgm.play();
        });
    </script>

</body>
</html>
</html>
