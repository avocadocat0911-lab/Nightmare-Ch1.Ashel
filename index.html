<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nightmare</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            background: #000;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* =========================
           게임 화면
        ========================= */

        #game {
            position: relative;

            width: auto;
            height: 100vh;

            aspect-ratio: 3 / 4;

            overflow: hidden;

            background-image: url("./background.jpeg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }


        /* =========================
           처음에 배경을 흐리게 하는 부분
        ========================= */

        #blur {
            position: absolute;

            top: -20px;
            left: -20px;
            right: -20px;
            bottom: -20px;

            background-image: url("./background.jpeg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            filter: blur(12px);

            z-index: 1;

            transition: opacity 0.8s ease;
        }


        /* =========================
           화면 가장자리 검은 비네트
        ========================= */

        #game::after {
            content: "";

            position: absolute;
            inset: 0;

            pointer-events: none;

            z-index: 5;

            background: radial-gradient(
                ellipse at center,
                rgba(0, 0, 0, 0) 40%,
                rgba(0, 0, 0, 0.2) 58%,
                rgba(0, 0, 0, 0.5) 78%,
                rgba(0, 0, 0, 0.85) 100%
            );
        }


        /* =========================
           PLAY 버튼
        ========================= */

        #play {
            position: absolute;

            top: 50%;
            left: 50%;

            transform: translate(-50%, -50%);

            z-index: 10;

            width: 150px;
            height: 55px;

            background: rgba(0, 0, 0, 0.85);

            border: 1px solid white;

            color: white;

            font-size: 18px;
            letter-spacing: 4px;

            cursor: pointer;

            transition: opacity 0.8s ease;
        }

        #play:hover {
            background: rgba(255, 255, 255, 0.15);
        }


        /* =========================
           게임 시작
        ========================= */

        #game.started #blur {
            opacity: 0;

            pointer-events: none;
        }

        #game.started #play {
            opacity: 0;

            pointer-events: none;
        }


        /* =========================
           모바일
        ========================= */

        @media (max-width: 600px) {

            #game {
                width: 100vw;
                height: 100dvh;

                aspect-ratio: auto;
            }

        }

    </style>
</head>


<body>


    <!-- 게임 화면 -->

    <div id="game">

        <!-- 처음에 흐린 배경 -->
        <div id="blur"></div>

        <!-- PLAY 버튼 -->
        <button id="play">PLAY</button>

    </div>



    <!-- =========================
         BGM
    ========================= -->

    <audio
        id="bgm"
        src="./bgm_clean.mp3"
        autoplay
        loop
        preload="auto">
    </audio>



    <script>

        const game = document.getElementById("game");
        const play = document.getElementById("play");
        const bgm = document.getElementById("bgm");


        /* BGM 볼륨 */

        bgm.volume = 0.3;


        /* =========================
           사이트 입장 시 BGM 자동재생 시도
        ========================= */

        bgm.play().catch(() => {
            console.log("브라우저가 자동재생을 막았습니다.");
        });


        /* =========================
           PLAY 버튼
        ========================= */

        play.addEventListener("click", () => {

            /* 흐림 제거 */

            game.classList.add("started");


            /* 자동재생이 막혀 있었다면
               PLAY를 눌렀을 때 BGM 재생 */

            if (bgm.paused) {

                bgm.play().catch(() => {
                    console.log("BGM 재생 실패");
                });

            }

        });

    </script>


</body>
</html>
