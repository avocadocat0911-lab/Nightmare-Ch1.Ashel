<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nightmare</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            background: #000;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }


        /* =========================
           게임 화면
        ========================= */

        #game {
            position: relative;

            width: auto;
            height: 100vh;

            aspect-ratio: 3 / 4;

            overflow: hidden;

            background-image: url("./background.jpeg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }


        /* =========================
           시작할 때 배경 블러
        ========================= */

        #blur {
            position: absolute;

            top: -30px;
            left: -30px;
            right: -30px;
            bottom: -30px;

            background-image: url("./background.jpeg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            filter: blur(18px);
            transform: scale(1.05);

            z-index: 2;

            opacity: 1;

            pointer-events: none;

            transition: opacity 0.8s ease;
        }


        /* =========================
           검은색 비네트
        ========================= */

        #vignette {
            position: absolute;
            inset: 0;

            z-index: 5;
            pointer-events: none;

            background: radial-gradient(
                ellipse at center,
                rgba(0, 0, 0, 0) 25%,
                rgba(0, 0, 0, 0.15) 45%,
                rgba(0, 0, 0, 0.45) 65%,
                rgba(0, 0, 0, 0.75) 82%,
                rgba(0, 0, 0, 0.95) 100%
            );
        }


        /* =========================
           PLAY 영역
        ========================= */

        #playArea {
            position: absolute;

            top: 50%;
            left: 50%;

            transform: translate(-50%, -50%);

            z-index: 10;

            display: flex;
            flex-direction: column;
            align-items: center;

            transition: opacity 0.8s ease;
        }


        /* =========================
           아이콘
        ========================= */

        #playIcon {
            width: 600px;
            height: 220px;

            object-fit: contain;

            display: block;

            margin-bottom: 2px;

            filter: none;
            opacity: 1;

            pointer-events: none;

            transform-origin: center center;

            animation: gentleFloat 4s ease-in-out infinite;
        }


        /* =========================
           아이콘 움직임
        ========================= */

        @keyframes gentleFloat {

            0% {
                transform: translateY(0) scale(1.8);
            }

            50% {
                transform: translateY(-12px) scale(1.8);
            }

            100% {
                transform: translateY(0) scale(1.8);
            }

        }


        /* =========================
           PLAY 버튼
        ========================= */

        #play {
            position: relative;

            z-index: 30;

            width: 115px;
            height: 38px;

            padding: 0;

            background: rgba(0, 0, 0, 0.85);

            border: 1px solid white;

            color: white;

            font-size: 13px;

            letter-spacing: 3px;

            cursor: pointer;

            pointer-events: auto;
        }

        #play:hover {
            background: rgba(255, 255, 255, 0.15);
        }


        /* =========================
           하단 음악바
        ========================= */

        #musicBar {
            position: absolute;

            left: 15px;
            right: 15px;
            bottom: 15px;

            height: 42px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 10px 0 14px;

            background: rgba(0, 0, 0, 0.8);

            border: 1px solid rgba(255, 255, 255, 0.35);

            z-index: 20;

            color: #ffffff;

            filter: blur(7px);
            opacity: 0.7;

            transition:
                filter 0.8s ease,
                opacity 0.8s ease;
        }


        /* =========================
           노래 제목
        ========================= */

        #songTitle {
            display: block;

            color: #ffffff;

            font-size: 12px;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;

            letter-spacing: 0.5px;

            min-width: 0;
        }


        /* =========================
           음악 ON / OFF
        ========================= */

        #musicButton {
            width: 30px;
            height: 30px;

            flex-shrink: 0;

            margin-left: 10px;

            border: none;

            background: transparent;

            color: #ffffff;

            font-size: 18px;

            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        #musicButton:hover {
            opacity: 0.7;
        }


        /* =========================
           PLAY 이후
        ========================= */

        #game.started #blur {
            opacity: 0;
        }

        #game.started #playArea {
            opacity: 0;
            pointer-events: none;
        }

        #game.started #musicBar {
            filter: blur(0);
            opacity: 1;
        }


        /* =========================
           모바일
        ========================= */

        @media (max-width: 600px) {

            #game {
                width: 100vw;
                height: 100dvh;

                aspect-ratio: auto;
            }

            #musicBar {
                left: 12px;
                right: 12px;
                bottom: 12px;
            }

            #songTitle {
                font-size: 11px;
            }

            #playIcon {
                width: 600px;
                height: 210px;
            }

            #play {
                width: 105px;
                height: 36px;

                font-size: 12px;
            }
        }

    </style>
</head>


<body>

    <div id="game">

        <!-- 시작할 때 배경 블러 -->
        <div id="blur"></div>

        <!-- 비네트 -->
        <div id="vignette"></div>


        <!-- PLAY 영역 -->

        <div id="playArea">

            <!-- 아이콘 -->
            <img
                id="playIcon"
                src="./icon.png"
                alt="">

            <!-- PLAY 버튼 -->
            <button
                id="play"
                type="button">
                PLAY
            </button>

        </div>


        <!-- 하단 음악바 -->

        <div id="musicBar">

            <span id="songTitle">
                倉庫の静寂-𝐀𝐬𝐡𝐞𝐥 𝐓𝐡𝐞𝐦𝐞 𝐬𝐨𝐧𝐠
            </span>

            <button
                id="musicButton"
                type="button"
                aria-label="BGM 끄기">
                🔊
            </button>

        </div>

    </div>


    <!-- =========================
         BGM
    ========================= -->

    <audio
        id="bgm"
        src="./bgm_clean.mp3"
        autoplay
        loop
        preload="auto">
    </audio>


    <script>

        const game = document.getElementById("game");
        const play = document.getElementById("play");
        const bgm = document.getElementById("bgm");
        const musicButton = document.getElementById("musicButton");


        /* BGM 볼륨 */

        bgm.volume = 0.3;


        /* =========================
           사이트에 들어오자마자 재생 시도
        ========================= */

        window.addEventListener("load", () => {

            bgm.play().catch(() => {
                console.log("브라우저가 자동재생을 차단했습니다.");
            });

        });


        /* =========================
           PLAY 버튼
        ========================= */

        play.addEventListener("click", async () => {

            /* 배경 블러 제거 */
            game.classList.add("started");


            /* 자동재생이 막힌 경우를 대비해서
               PLAY 클릭에서도 다시 재생 시도 */

            if (bgm.paused) {

                try {
                    await bgm.play();
                } catch (error) {
                    console.log("BGM 재생 실패:", error);
                }

            }

        });


        /* =========================
           음악 ON / OFF
        ========================= */

        musicButton.addEventListener("click", async () => {

            if (bgm.paused) {

                try {
                    await bgm.play();
                } catch (error) {
                    console.log("BGM 재생 실패:", error);
                }

            } else {

                bgm.pause();

            }

        });


        /* =========================
           음악 아이콘 변경
        ========================= */

        bgm.addEventListener("play", () => {

            musicButton.textContent = "🔊";
            musicButton.setAttribute("aria-label", "BGM 끄기");

        });


        bgm.addEventListener("pause", () => {

            musicButton.textContent = "🔇";
            musicButton.setAttribute("aria-label", "BGM 켜기");

        });

    </script>

</body>
</html>
