<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nightmare</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            background: #000;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }


        /* =========================
           게임 화면
        ========================= */

        #game {
            position: relative;

            width: auto;
            height: 100vh;

            aspect-ratio: 3 / 4;

            overflow: hidden;

            background-image: url("./background.jpeg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }


        /* =========================
           시작할 때 배경 블러
        ========================= */

        #blur {
            position: absolute;

            top: -30px;
            left: -30px;
            right: -30px;
            bottom: -30px;

            background-image: url("./background.jpeg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            filter: blur(18px);
            transform: scale(1.08);

            z-index: 2;

            opacity: 1;

            pointer-events: none;

            transition: opacity 0.8s ease;
        }


        /* =========================
           검은색 비네트
        ========================= */

        #vignette {
            position: absolute;

            inset: 0;

            z-index: 5;

            pointer-events: none;

            background: radial-gradient(
                ellipse at center,
                rgba(0, 0, 0, 0) 25%,
                rgba(0, 0, 0, 0.15) 45%,
                rgba(0, 0, 0, 0.45) 65%,
                rgba(0, 0, 0, 0.75) 82%,
                rgba(0, 0, 0, 0.95) 100%
            );
        }


        /* =========================
           캐릭터
        ========================= */

        #character {
            position: absolute;

            left: 50%;
            bottom: 0;

            width: 680px;
            height: auto;

            transform: translateX(-50%);

            z-index: 7;

            object-fit: contain;

            pointer-events: auto;

            transform-origin: center bottom;

            /* 시작 전에는 움직이지 않음 */
            animation: characterFloat 4.5s ease-in-out infinite;
            animation-play-state: paused;

            /* 시작 전 블러 */
            filter: blur(12px);

            transition: filter 0.8s ease;
        }


        /* =========================
           캐릭터 움직임
        ========================= */

        @keyframes characterFloat {

            0% {
                transform: translateX(-50%) translateY(0);
            }

            50% {
                transform: translateX(-50%) translateY(-10px);
            }

            100% {
                transform: translateX(-50%) translateY(0);
            }

        }


        /* =========================
           시작 후 캐릭터 움직임
        ========================= */

        #game.started #character {
            filter: blur(0);

            animation-play-state: running;
        }


        /* =========================
           마우스를 올렸을 때
           시작 후에만 흰색 외곽선
        ========================= */

        #game.started #character:hover {
            animation:
                characterFloat 4.5s ease-in-out infinite,
                characterGlow 2.2s ease-in-out infinite;
        }


        /* =========================
           흰색 외곽선
        ========================= */

        @keyframes characterGlow {

            0% {
                filter:
                    blur(0)
                    drop-shadow(0 0 0 rgba(255, 255, 255, 0))
                    drop-shadow(0 0 2px rgba(255, 255, 255, 0.15));
            }

            50% {
                filter:
                    blur(0)
                    drop-shadow(0 0 2px rgba(255, 255, 255, 1))
                    drop-shadow(0 0 8px rgba(255, 255, 255, 0.8))
                    drop-shadow(0 0 15px rgba(255, 255, 255, 0.4));
            }

            100% {
                filter:
                    blur(0)
                    drop-shadow(0 0 0 rgba(255, 255, 255, 0))
                    drop-shadow(0 0 2px rgba(255, 255, 255, 0.15));
            }

        }


        /* =========================
           시작 전 그림자
        ========================= */

        #shadow {
            position: absolute;

            left: 50%;
            bottom: 0;

            width: 680px;
            height: auto;

            transform: translateX(-50%);

            z-index: 8;

            pointer-events: none;

            object-fit: contain;

            /* 흰색 배경을 자연스럽게 없앰 */
            mix-blend-mode: multiply;

            opacity: 1;

            transition: opacity 0.8s ease;
        }


        /* =========================
           PLAY 영역
        ========================= */

        #playArea {
            position: absolute;

            top: 50%;
            left: 50%;

            transform: translate(-50%, -50%);

            z-index: 10;

            display: flex;
            flex-direction: column;
            align-items: center;

            transition: opacity 0.8s ease;
        }


        /* =========================
           PLAY 아이콘
        ========================= */

        #playIcon {
            width: 600px;
            height: 220px;

            object-fit: contain;

            display: block;

            margin-bottom: 2px;

            filter: none;
            opacity: 1;

            pointer-events: none;

            animation: gentleFloat 4s ease-in-out infinite;
        }


        @keyframes gentleFloat {

            0% {
                transform: translateY(0) scale(1.8);
            }

            50% {
                transform: translateY(-12px) scale(1.8);
            }

            100% {
                transform: translateY(0) scale(1.8);
            }

        }


        /* =========================
           PLAY 버튼
        ========================= */

        #play {
            position: relative;

            z-index: 30;

            width: 115px;
            height: 38px;

            padding: 0;

            background: rgba(0, 0, 0, 0.85);

            border: 1px solid white;

            color: white;

            font-size: 13px;

            letter-spacing: 3px;

            cursor: pointer;

            pointer-events: auto;
        }

        #play:hover {
            background: rgba(255, 255, 255, 0.15);
        }


        /* =========================
           하단 음악바
        ========================= */

        #musicBar {
            position: absolute;

            left: 0;
            right: 0;
            bottom: 0;

            height: 42px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 12px 0 14px;

            background: rgba(0, 0, 0, 0.8);

            border-top: 1px solid rgba(255, 255, 255, 0.35);

            z-index: 20;

            color: #ffffff;

            filter: blur(7px);

            opacity: 0.7;

            transition:
                filter 0.8s ease,
                opacity 0.8s ease;
        }


        /* =========================
           노래 제목
        ========================= */

        #songTitle {
            display: block;

            color: #ffffff;

            font-size: 12px;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;

            letter-spacing: 0.5px;

            min-width: 0;
        }


        /* =========================
           음악 ON / OFF
        ========================= */

        #musicButton {
            width: 30px;
            height: 30px;

            flex-shrink: 0;

            margin-left: 10px;

            border: none;

            background: transparent;

            color: #ffffff;

            font-size: 18px;

            cursor: pointer;

            display: flex;

            align-items: center;

            justify-content: center;
        }


        /* =========================
           PLAY 이후
        ========================= */

        #game.started #blur {
            opacity: 0;
        }

        #game.started #shadow {
            opacity: 0;
        }

        #game.started #playArea {
            opacity: 0;

            pointer-events: none;
        }

        #game.started #musicBar {
            filter: blur(0);

            opacity: 1;
        }


        /* =========================
           모바일
        ========================= */

        @media (max-width: 600px) {

            #game {
                width: 100vw;
                height: 100dvh;

                aspect-ratio: auto;
            }

            #character {
                width: 550px;
                bottom: 0;
            }

            #shadow {
                width: 550px;
                bottom: 0;
            }

            #musicBar {
                left: 0;
                right: 0;
                bottom: 0;
            }

            #songTitle {
                font-size: 11px;
            }

            #playIcon {
                width: 600px;
                height: 210px;
            }

            #play {
                width: 105px;
                height: 36px;

                font-size: 12px;
            }

        }

    </style>
</head>


<body>

    <div id="game">

        <!-- 시작할 때 배경 블러 -->
        <div id="blur"></div>


        <!-- 비네트 -->
        <div id="vignette"></div>


        <!-- =========================
             캐릭터
        ========================= -->

        <img
            id="character"
            src="./blink.Ashel.webp"
            alt="">


        <!-- =========================
             그림자
             캐릭터 위에 덮임
        ========================= -->

        <img
            id="shadow"
            src="./shadow.Ashel.png"
            alt="">


        <!-- =========================
             PLAY 영역
        ========================= -->

        <div id="playArea">

            <!-- PLAY 아이콘 -->
            <img
                id="playIcon"
                src="./icon.png"
                alt="">

            <!-- PLAY 버튼 -->
            <button
                id="play"
                type="button">
                PLAY
            </button>

        </div>


        <!-- =========================
             하단 음악바
        ========================= -->

        <div id="musicBar">

            <span id="songTitle">
                倉庫の静寂-𝐀𝐬𝐡𝐞𝐥 𝐓𝐡𝐞𝐦𝐞 𝐬𝐨𝐧𝐠
            </span>

            <button
                id="musicButton"
                type="button"
                aria-label="BGM 끄기">
                🔊
            </button>

        </div>

    </div>


    <!-- =========================
         BGM
    ========================= -->

    <audio
        id="bgm"
        src="./bgm_clean.mp3"
        autoplay
        loop
        preload="auto">
    </audio>


    <script>

        const game = document.getElementById("game");
        const play = document.getElementById("play");
        const bgm = document.getElementById("bgm");
        const musicButton = document.getElementById("musicButton");


        /* =========================
           BGM 볼륨
        ========================= */

        bgm.volume = 0.3;


        /* =========================
           사이트 입장 시 자동재생
        ========================= */

        bgm.play().catch(() => {
            console.log("브라우저가 자동재생을 차단했습니다.");
        });


        /* =========================
           PLAY 버튼
        ========================= */

        play.addEventListener("click", async () => {

            /*
             * 배경 블러 제거
             * 캐릭터 블러 제거
             * 그림자 제거
             * 음악바 블러 제거
             */
            game.classList.add("started");


            /* BGM 재생 */
            if (bgm.paused) {

                try {
                    await bgm.play();
                } catch (error) {
                    console.log("BGM 재생 실패:", error);
                }

            }

        });


        /* =========================
           음악 ON / OFF
        ========================= */

        musicButton.addEventListener("click", async () => {

            if (bgm.paused) {

                try {
                    await bgm.play();
                } catch (error) {
                    console.log("BGM 재생 실패:", error);
                }

            } else {

                bgm.pause();

            }

        });


        /* =========================
           음악 아이콘 변경
        ========================= */

        bgm.addEventListener("play", () => {
            musicButton.textContent = "🔊";
        });


        bgm.addEventListener("pause", () => {
            musicButton.textContent = "🔇";
        });

    </script>

</body>
</html>
