<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nightmare</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            background: black;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .game-screen {
            height: 100vh;
            aspect-ratio: 3 / 4;

            background-image: url("background.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            position: relative;
        }

        /* 모바일 */
        @media (max-width: 600px) {
            .game-screen {
                width: 100vw;
                height: 100dvh;
                aspect-ratio: auto;
                background-size: cover;
            }
        }

        /* BGM 플레이 버튼 */
        #playButton {
            position: absolute;
            left: 50%;
            bottom: 40px;
            transform: translateX(-50%);

            padding: 12px 28px;
            font-size: 16px;

            background: rgba(0, 0, 0, 0.8);
            color: white;
            border: 1px solid white;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="game-screen">

        <button id="playButton">▶ BGM 재생</button>

    </div>

    <!-- BGM -->
    <audio id="bgm" src="bgm_clean.mp3" loop></audio>

    <script>
        const bgm = document.getElementById("bgm");
        const playButton = document.getElementById("playButton");

        bgm.volume = 0.3;

        playButton.addEventListener("click", function () {
            bgm.play();

            playButton.textContent = "♪ BGM 재생 중";
        });
    </script>

</body>
</html>
