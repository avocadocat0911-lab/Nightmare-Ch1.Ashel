<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nightmare</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            background: black;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* 게임 화면 */
        .game-screen {
            height: 100vh;
            aspect-ratio: 3 / 4;

            background-image: url("background.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            position: relative;

            /* 처음에는 블러 */
            filter: blur(8px);
            transition: filter 0.8s ease;
        }

        /* 게임 시작 후 블러 제거 */
        .game-screen.started {
            filter: blur(0);
        }

        /* 중앙 버튼 */
        #playButton {
            position: absolute;
            z-index: 10;

            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);

            width: 180px;
            height: 60px;

            background: rgba(0, 0, 0, 0.8);
            color: white;

            border: 2px solid white;
            border-radius: 4px;

            font-size: 20px;
            cursor: pointer;
        }

        /* 모바일 */
        @media (max-width: 600px) {
            .game-screen {
                width: 100vw;
                height: 100dvh;
                aspect-ratio: auto;
            }
        }
    </style>
</head>

<body>

    <div class="game-screen" id="gameScreen">

        <button id="playButton" type="button">
            ▶ PLAY
        </button>

    </div>

    <!-- BGM -->
    <audio id="bgm" src="bgm_clean.mp3" loop preload="auto"></audio>

    <script>
        const gameScreen = document.getElementById("gameScreen");
        const playButton = document.getElementById("playButton");
        const bgm = document.getElementById("bgm");

        bgm.volume = 0.3;

        playButton.addEventListener("click", function () {

            // 음악을 처음부터 시작
            bgm.currentTime = 0;

            bgm.play().then(function () {

                // 블러 제거
                gameScreen.classList.add("started");

                // 버튼 제거
                playButton.style.display = "none";

            }).catch(function(error) {
                console.log("BGM 재생 실패:", error);
            });

        });
    </script>

</body>
</html>
