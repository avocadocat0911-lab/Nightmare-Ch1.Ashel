<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nightmare</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            background: black;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* 게임 화면 */
        .game-screen {
            height: 100vh;
            aspect-ratio: 3 / 4;
            position: relative;
            overflow: hidden;

            /* 원래 배경 */
            background-image: url("background.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* 블러 레이어 */
        .blur-layer {
            position: absolute;
            inset: 0;

            background: inherit;
            background-size: cover;
            background-position: center;

            filter: blur(10px);
            transform: scale(1.05);

            transition: opacity 1s ease;
            z-index: 1;
        }

        /* 시작하면 블러 제거 */
        .game-screen.started .blur-layer {
            opacity: 0;
            pointer-events: none;
        }

        /* PLAY 버튼 */
        #playButton {
            position: absolute;
            z-index: 2;

            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);

            width: 180px;
            height: 60px;

            background: rgba(0, 0, 0, 0.8);
            color: white;

            border: 2px solid white;
            border-radius: 3px;

            font-size: 20px;
            font-weight: bold;

            cursor: pointer;
        }

        /* 시작하면 버튼 사라짐 */
        .game-screen.started #playButton {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        /* 모바일 */
        @media (max-width: 600px) {
            .game-screen {
                width: 100vw;
                height: 100dvh;
                aspect-ratio: auto;
            }
        }
    </style>
</head>

<body>

    <div class="game-screen" id="gameScreen">

        <!-- 블러 처리 -->
        <div class="blur-layer"></div>

        <!-- 중앙 PLAY -->
        <button id="playButton">PLAY</button>

    </div>

    <!-- BGM -->
    <audio id="bgm" src="bgm_clean.mp3" autoplay loop></audio>

    <script>
        const gameScreen = document.getElementById("gameScreen");
        const playButton = document.getElementById("playButton");
        const bgm = document.getElementById("bgm");

        bgm.volume = 0.3;

        /*
         * 사이트에 들어오면 BGM 자동재생 시도
         */
        bgm.play().catch(() => {
            console.log("브라우저가 자동재생을 막았습니다.");
        });

        /*
         * PLAY 버튼
         * 음악은 끊지 않고 블러만 제거
         */
        playButton.addEventListener("click", () => {

            gameScreen.classList.add("started");

            /*
             * 자동재생이 막혔다면
             * PLAY 클릭을 계기로 다시 재생 시도
             */
            if (bgm.paused) {
                bgm.currentTime = 0;
                bgm.play();
            }
        });
    </script>

</body>
</html>
