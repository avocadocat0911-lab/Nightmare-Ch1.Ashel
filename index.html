<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nightmare</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            background: #000;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }


        /* =========================
           게임 화면
        ========================= */

        #game {
            position: relative;

            width: auto;
            height: 100vh;

            aspect-ratio: 3 / 4;

            overflow: hidden;

            background-image: url("./background.jpeg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }


        /* =========================
           처음에 흐리게 보이는 배경
        ========================= */

        #blur {
            position: absolute;

            top: -30px;
            left: -30px;
            right: -30px;
            bottom: -30px;

            background-image: url("./background.jpeg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            filter: blur(18px);

            transform: scale(1.05);

            z-index: 2;

            opacity: 1;

            transition: opacity 1s ease;
        }


        /* =========================
           검은색 비네트
        ========================= */

        #vignette {
            position: absolute;
            inset: 0;

            z-index: 5;
            pointer-events: none;

            background: radial-gradient(
                ellipse at center,
                rgba(0, 0, 0, 0) 25%,
                rgba(0, 0, 0, 0.15) 45%,
                rgba(0, 0, 0, 0.45) 65%,
                rgba(0, 0, 0, 0.75) 82%,
                rgba(0, 0, 0, 0.95) 100%
            );
        }


        /* =========================
           PLAY 버튼
        ========================= */

        #play {
            position: absolute;

            top: 50%;
            left: 50%;

            transform: translate(-50%, -50%);

            z-index: 10;

            width: 150px;
            height: 55px;

            background: rgba(0, 0, 0, 0.85);

            border: 1px solid white;

            color: white;

            font-size: 18px;
            letter-spacing: 4px;

            cursor: pointer;

            transition:
                opacity 0.8s ease,
                background 0.2s ease;
        }

        #play:hover {
            background: rgba(255, 255, 255, 0.15);
        }


        /* =========================
           하단 음악 바
        ========================= */

        #musicBar {
            position: absolute;

            left: 15px;
            right: 15px;
            bottom: 15px;

            height: 42px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 10px 0 14px;

            background: rgba(0, 0, 0, 0.8);

            border: 1px solid rgba(255, 255, 255, 0.35);

            z-index: 20;

            /* 처음에는 음악바 전체를 흐리게 */
            filter: blur(7px);

            opacity: 0.7;

            transition:
                filter 1s ease,
                opacity 1s ease;
        }


        /* =========================
           노래 제목
        ========================= */

        #songTitle {
            color: #ffffff;

            font-size: 12px;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;

            letter-spacing: 0.5px;

            min-width: 0;
        }


        /* =========================
           음악 ON / OFF 버튼
        ========================= */

        #musicButton {
            width: 30px;
            height: 30px;

            flex-shrink: 0;

            margin-left: 10px;

            border: none;

            background: transparent;

            color: #ffffff;

            font-size: 18px;

            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        #musicButton:hover {
            opacity: 0.7;
        }


        /* =========================
           PLAY 이후
        ========================= */

        #game.started #blur {
            opacity: 0;
            pointer-events: none;
        }

        #game.started #play {
            opacity: 0;
            pointer-events: none;
        }

        /* 음악바도 PLAY 후 원래대로 */
        #game.started #musicBar {
            filter: blur(0);
            opacity: 1;
        }


        /* =========================
           모바일
        ========================= */

        @media (max-width: 600px) {

            #game {
                width: 100vw;
                height: 100dvh;

                aspect-ratio: auto;
            }

            #musicBar {
                left: 12px;
                right: 12px;
                bottom: 12px;
            }

            #songTitle {
                font-size: 11px;
            }
        }

    </style>
</head>


<body>

    <div id="game">

        <!-- 흐린 배경 -->
        <div id="blur"></div>

        <!-- 비네트 -->
        <div id="vignette"></div>

        <!-- PLAY -->
        <button id="play">PLAY</button>


        <!-- =========================
             하단 음악바
        ========================= -->

        <div id="musicBar">

            <span id="songTitle">
                倉庫の静寂-𝐀𝐬𝐡𝐞𝐥 𝐓𝐡𝐞𝐦𝐞 𝐬𝐨𝐧𝐠
            </span>

            <button
                id="musicButton"
                type="button"
                aria-label="BGM 끄기">
                🔊
            </button>

        </div>

    </div>


    <!-- BGM -->

    <audio
        id="bgm"
        src="./bgm_clean.mp3"
        autoplay
        loop
        preload="auto">
    </audio>


    <script>

        const game = document.getElementById("game");
        const play = document.getElementById("play");
        const bgm = document.getElementById("bgm");
        const musicButton = document.getElementById("musicButton");


        /* BGM 볼륨 */

        bgm.volume = 0.3;


        /* =========================
           사이트 입장 시 자동재생 시도
        ========================= */

        bgm.play().catch(() => {
            console.log("자동재생이 차단되었습니다.");
        });


        /* =========================
           PLAY
        ========================= */

        play.addEventListener("click", () => {

            /* 배경 선명하게 */
            game.classList.add("started");

            /* 자동재생이 막혀있었다면 재생 */
            if (bgm.paused) {

                bgm.play().catch(() => {
                    console.log("BGM 재생 실패");
                });

            }

        });


        /* =========================
           음악 ON / OFF
        ========================= */

        musicButton.addEventListener("click", () => {

            if (bgm.paused) {

                bgm.play().catch(() => {
                    console.log("BGM 재생 실패");
                });

            } else {

                bgm.pause();

            }

        });


        /* =========================
           아이콘 변경
        ========================= */

        bgm.addEventListener("play", () => {

            musicButton.textContent = "🔊";
            musicButton.setAttribute("aria-label", "BGM 끄기");

        });


        bgm.addEventListener("pause", () => {

            musicButton.textContent = "🔇";
            musicButton.setAttribute("aria-label", "BGM 켜기");

        });

    </script>

</body>
</html>
