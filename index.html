<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nightmare</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            background: black;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .game-screen {
            height: 100vh;
            aspect-ratio: 3 / 4;

            background-image: url("background.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            position: relative;
        }

        @media (max-width: 600px) {
            .game-screen {
                width: 100vw;
                height: 100dvh;
                aspect-ratio: auto;
                background-size: cover;
            }
        }

        /* BGM 버튼 */
        #playButton {
            position: absolute;
            z-index: 9999;

            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);

            width: 180px;
            height: 60px;

            background: black;
            color: white;

            border: 2px solid white;
            border-radius: 5px;

            font-size: 18px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="game-screen">

        <button id="playButton" type="button">
            ▶ PLAY
        </button>

    </div>

    <!-- BGM -->
    <audio id="bgm" src="bgm_clean.mp3" loop preload="auto"></audio>

    <script>
        const button = document.getElementById("playButton");
        const bgm = document.getElementById("bgm");

        bgm.volume = 0.3;

        button.addEventListener("click", function () {

            bgm.play()
                .then(function () {
                    button.textContent = "♪ PLAYING";
                })
                .catch(function (error) {
                    console.log("BGM 재생 실패:", error);
                    button.textContent = "BGM ERROR";
                });

        });
    </script>

</body>
</html>
